name: Build SongQ APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build SongQ APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare SongQ.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SongQ.apk

      - name: Upload SongQ.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: SongQ-apk
          path: dist/SongQ.apk
